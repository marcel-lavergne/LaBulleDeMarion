# Configuration Netlify — La Bulle de Marion

[build]
  command = "npm run build"
  publish = "dist"

# Dossier des fonctions serveur (témoignages + admin)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# www → adresse principale (une seule version indexée)
[[redirects]]
  from = "https://www.labulledemarion.fr/*"
  to = "https://labulledemarion.fr/:splat"
  status = 301
  force = true
